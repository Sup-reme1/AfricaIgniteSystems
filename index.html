<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard · Africa Ignite Systems</title>
    <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-theme.js"></script>
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
  </head>

  <body data-page="dashboard" class="bg-surface font-body-md text-on-surface antialiased">
    <div data-include="sidebar"></div>
    <div class="app-content">
      <div data-include="header"></div>
      <main class="w-full pt-16 bg-surface">
        <div class="flex flex-col w-full">
          <div
            class="p-space-lg max-w-[1440px] w-full mx-auto space-y-space-lg"
          >
            <!-- Top Executive Header & Filter Ribbon -->
            <div
              class="bg-surface-container-lowest rounded-xl p-space-lg shadow-sm relative overflow-hidden"
            >
              <div
                class="absolute -right-16 -top-16 w-80 h-80 rounded-full bg-primary/5 blur-3xl pointer-events-none"
              ></div>
              <div
                class="relative flex flex-col xl:flex-row xl:items-center justify-between gap-space-md pb-space-md"
              >
                <div class="space-y-1">
                  <!-- <div
                    class="flex items-center gap-space-xs text-on-surface-variant font-label-sm text-label-sm uppercase tracking-wider"
                  >
                    <span>Portfolio Health</span>
                    <span class="text-outline">•</span>
                    <span class="text-primary font-title-sm text-label-sm"
                      >Active Execution Sprint</span
                    >
                  </div> -->
                  <h1
                    class="font-headline-lg text-headline-lg text-on-surface tracking-tight"
                  >
                    Africa Ignite Systems
                  </h1>
                  <p
                    class="font-body-md text-body-md text-on-surface-variant max-w-3xl"
                  >
                    Tracking <span data-stat="objectives"></span> company objectives,
                    <span data-stat="milestones"></span> milestones and
                    <span data-stat="steps"></span> checklist steps.
                  </p>
                </div>
              </div>
              <!-- Department & Status Segmented Controls -->
              <div
                class="pt-space-md flex flex-wrap items-center justify-between gap-space-md"
              >
                <!-- Department Pills -->
                <div
                  class="flex flex-wrap items-center gap-1.5 p-1 bg-surface-container-low rounded-xl"
                >
                  <button
                    type="button"
                    class="px-space-md py-1 rounded-lg font-title-sm text-title-sm bg-surface-container-lowest text-on-surface shadow-sm"
                    data-department="all"
                    >
                      All Departments
                  </button>
                  <button
                    type="button"
                    class="px-space-md py-1 rounded-lg font-title-sm text-title-sm text-on-surface-variant hover:text-on-surface transition-colors"
                    data-department="Product"
                    >
                      Product
                  </button>
                  <button
                    type="button"
                    class="px-space-md py-1 rounded-lg font-title-sm text-title-sm text-on-surface-variant hover:text-on-surface transition-colors"
                    data-department="Engineering"
                    >
                      Engineering
                  </button>
                  <button
                    type="button"
                    class="px-space-md py-1 rounded-lg font-title-sm text-title-sm text-on-surface-variant hover:text-on-surface transition-colors"
                    data-department="Design"
                    >
                      Design
                  </button>
                  <button
                    type="button"
                    class="px-space-md py-1 rounded-lg font-title-sm text-title-sm text-on-surface-variant hover:text-on-surface transition-colors"
                    data-department="Data"
                    >
                      Data
                  </button>
                </div>
                <!-- Metric Health Status Filter Chips -->
                <div class="flex flex-wrap items-center gap-space-xs">
                  <span
                    class="font-label-sm text-label-sm text-on-surface-variant pr-1"
                    >Filter:</span
                  >
                  <button
                    type="button"
                    class="flex items-center gap-1.5 px-space-sm py-1 rounded-full bg-surface-container font-label-md text-label-md text-on-surface"
                    data-status="all"
                    >
                    <span>All</span>
                    <span
                      class="px-1.5 py-0.5 rounded-full bg-surface-container-highest text-on-surface font-label-sm text-label-sm"
                       data-status-count>18</span
                    >
                  </button>
                  <button
                    type="button"
                    class="flex items-center gap-1.5 px-space-sm py-1 rounded-full bg-tertiary-container/10 text-tertiary font-label-md text-label-md hover:bg-tertiary-container/20 transition-colors"
                    data-status="on-track"
                    >
                    <span class="w-1.5 h-1.5 rounded-full bg-tertiary"></span>
                    <span>On Track</span>
                    <span class="font-label-sm text-label-sm font-semibold"
                       data-status-count>12</span
                    >
                  </button>
                  <button
                    type="button"
                    class="flex items-center gap-1.5 px-space-sm py-1 rounded-full bg-secondary-container/60 text-on-secondary-fixed font-label-md text-label-md hover:bg-secondary-container transition-colors"
                    data-status="needs-attention"
                    >
                    <span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
                    <span>Needs Attention</span>
                    <span class="font-label-sm text-label-sm font-semibold"
                       data-status-count>4</span
                    >
                  </button>
                  <button
                    type="button"
                    class="flex items-center gap-1.5 px-space-sm py-1 rounded-full bg-error-container text-on-error-container font-label-md text-label-md hover:bg-error-container/80 transition-colors"
                    data-status="at-risk"
                    >
                    <span class="w-1.5 h-1.5 rounded-full bg-error"></span>
                    <span>At Risk</span>
                    <span class="font-label-sm text-label-sm font-semibold"
                       data-status-count>2</span
                    >
                  </button>
                </div>
              </div>
            </div>
            <!-- Stat cards: rendered from data/okrs.json by assets/js/pages/dashboard.js -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-space-md" data-stat-cards aria-live="polite">
              <div class="h-[140px] bg-surface-container-lowest rounded-xl shadow-sm animate-pulse"></div>
              <div class="h-[140px] bg-surface-container-lowest rounded-xl shadow-sm animate-pulse"></div>
              <div class="h-[140px] bg-surface-container-lowest rounded-xl shadow-sm animate-pulse"></div>
              <div class="h-[140px] bg-surface-container-lowest rounded-xl shadow-sm animate-pulse"></div>
            </div>
            <!-- Main Dynamic Content Grid -->
            <div
              class="grid grid-cols-1 lg:grid-cols-12 gap-space-lg items-start"
            >
              <!-- Primary Column (Left 8 Cols) -->
              <div class="lg:col-span-8 space-y-space-md">
                <div class="flex flex-wrap items-center justify-between gap-space-sm pb-1">
                  <div class="flex items-center gap-space-xs">
                    <h2
                      class="font-headline-sm text-headline-sm text-on-surface"
                    >
                      Active Company Objectives
                    </h2>
                    <span
                      class="px-2 py-0.5 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm"
                       data-shown-count>3 of 5 Shown</span
                    >
                  </div>
                  <div class="flex items-center gap-space-md">
                    <button
                      type="button"
                      class="font-title-sm text-title-sm text-primary hover:underline flex items-center gap-1"
                      data-expand-all
                    >
                      <span data-expand-all-label>Expand all</span>
                      <span class="material-symbols-outlined text-sm"
                        >unfold_more</span
                      >
                    </button>
                    <button
                      type="button"
                      class="flex items-center gap-1 h-9 px-space-md rounded-lg bg-primary-container hover:bg-primary text-on-primary font-title-sm text-title-sm shadow-sm transition-colors"
                      data-add-objective
                    >
                      <span class="material-symbols-outlined text-lg">add</span>
                      <span>Add objective</span>
                    </button>
                  </div>
                </div>
                <!-- Rendered from data/okrs.json (AIS.okrs) by assets/js/pages/dashboard.js -->
                <div class="space-y-space-md" data-objectives-list aria-live="polite">
                  <div class="bg-surface-container-lowest rounded-xl p-space-lg shadow-sm font-body-md text-body-md text-on-surface-variant">
                    Loading objectives…
                  </div>
                </div>
              </div>
              <!-- Blockers & upcoming milestones: rendered by assets/js/pages/dashboard.js -->
              <aside class="order-first lg:order-none lg:col-span-4 lg:sticky lg:top-20 lg:max-h-[calc(100vh-6rem)] lg:overflow-y-auto" aria-label="Blockers and upcoming milestones">
                <section class="bg-surface-container-lowest rounded-xl p-space-lg shadow-sm space-y-space-md">
                  <div class="flex items-center justify-between gap-2">
                    <h3 class="font-title-md text-title-md text-on-surface">Blockers &amp; Milestones</h3>
                    <span class="font-label-sm text-label-sm text-on-surface-variant" data-blockers-summary></span>
                  </div>
                  <div class="space-y-space-lg" data-blockers-body>
                    <p class="font-body-sm text-body-sm text-on-surface-variant">Loading…</p>
                  </div>
                </section>
              </aside>
            </div>
          </div>
        </div>
      </main>
      <div data-include="footer"></div>
    </div>

    <script src="assets/js/layout.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/okrs.js"></script>
    <script src="assets/js/drawer.js"></script>
    <script src="assets/js/objective-form.js"></script>
    <script src="assets/js/router.js"></script>
    <script src="assets/js/pages/dashboard.js"></script>
  </body>
</html>
