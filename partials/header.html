<header
  class="app-header fixed top-0 right-0 h-16 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] z-30 px-space-md sm:px-space-lg flex items-center justify-between gap-space-md"
>
  <div class="flex items-center gap-space-sm sm:gap-space-md flex-1 max-w-xl min-w-0">
    <button
      class="lg:hidden p-2 -ml-2 rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface shrink-0"
      type="button"
      aria-label="Open menu"
      aria-controls="app-sidebar"
      aria-expanded="false"
      data-sidebar-open
    >
      <span class="material-symbols-outlined">menu</span>
    </button>
    <div class="relative w-full min-w-0">
      <span
        class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg"
        >search</span
      ><input
        class="w-full h-10 pl-10 pr-4 bg-surface-container-low rounded-lg font-body-sm text-body-sm text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary-container/20"
        placeholder="Search OKRs, key results, team members..."
        type="search"
        aria-label="Search"
      />
    </div>
    <!-- <div class="hidden xl:flex items-center gap-1.5 px-space-sm py-1 bg-surface-container rounded-full shrink-0">
      <span class="w-2 h-2 rounded-full bg-primary"></span
      ><span class="font-label-sm text-label-sm text-on-surface font-medium">Q3 FY25 • 42 Days Remaining</span>
    </div> -->
  </div>
  <div class="flex items-center gap-space-sm sm:gap-space-md shrink-0">
    <!-- <button
      class="relative p-2 rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors"
      type="button"
      aria-label="Notifications"
    >
      <span class="material-symbols-outlined">notifications</span
      ><span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-error"></span>
    </button> -->
    <button
      class="hidden sm:flex items-center gap-1.5 h-10 px-space-md bg-primary-container hover:bg-primary text-on-primary rounded-lg font-title-sm text-title-sm transition-colors shadow-sm"
      type="button"
      data-add-objective
    >
      <span class="material-symbols-outlined text-lg">add</span><span>New Objective</span>
    </button>
    <!-- Signed-in user (filled in by app.js from AIS.auth) -->
    <div class="relative" data-user-menu>
      <button
        type="button"
        class="flex items-center gap-space-sm pl-space-xs pr-1 py-1 rounded-lg hover:bg-surface-container-high transition-colors"
        aria-haspopup="menu"
        aria-expanded="false"
        aria-controls="user-menu"
        data-user-menu-toggle
      >
        <span class="w-8 h-8 rounded-full bg-primary-container text-on-primary flex items-center justify-center font-label-md text-label-md" data-user-initials>?</span>
        <span class="hidden md:block text-left max-w-[12rem]">
          <span class="block font-title-sm text-title-sm text-on-surface leading-tight truncate" data-user-name></span>
          <span class="block font-label-sm text-label-sm text-on-surface-variant leading-tight truncate" data-user-email></span>
        </span>
        <span class="material-symbols-outlined text-on-surface-variant text-lg">expand_more</span>
      </button>
      <div
        id="user-menu"
        role="menu"
        class="hidden absolute right-0 mt-2 w-64 bg-surface-container-lowest rounded-xl shadow-lg ring-1 ring-outline-variant/40 p-space-xs z-50"
      >
        <div class="px-space-sm py-space-sm border-b border-outline-variant/40 mb-space-xs space-y-0.5">
          <div class="font-label-sm text-label-sm text-on-surface-variant">Signed in as</div>
          <div class="font-title-sm text-title-sm text-on-surface truncate" data-user-name></div>
          <div class="flex items-center gap-1.5 font-body-sm text-body-sm text-on-surface-variant min-w-0">
            <span class="material-symbols-outlined text-base">mail</span><span class="truncate" data-user-email></span>
          </div>
          <div class="hidden flex items-center gap-1.5 font-body-sm text-body-sm text-on-surface-variant" data-user-phone-row>
            <span class="material-symbols-outlined text-base">call</span><span data-user-phone></span>
          </div>
        </div>
        <button
          type="button"
          role="menuitem"
          class="w-full flex items-center gap-2 px-space-sm py-2 rounded-lg text-left font-body-md text-body-md text-on-surface hover:bg-surface-container-high"
          data-sign-out
        >
          <span class="material-symbols-outlined text-lg text-on-surface-variant">logout</span>Sign out
        </button>
      </div>
    </div>
  </div>
</header>
