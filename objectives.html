<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Objective Hierarchy · Africa Ignite Systems</title>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-theme.js"></script>
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/pages/objectives.css" />
  </head>

  <body data-page="objectives" class="bg-surface font-body-md text-on-surface antialiased">
    <div data-include="sidebar"></div>
    <div class="app-content">
      <div data-include="header"></div>
      <main class="w-full pt-16 bg-surface">
        <div class="flex flex-col w-full">
          <div class="px-space-lg py-space-md bg-surface flex flex-col gap-space-md">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-space-md">
              <div>
                <div class="flex items-center gap-space-xs mb-1">
                  <span class="font-label-sm text-label-sm uppercase tracking-wider text-primary">Strategic
                    Architecture</span>
                  <!-- <span class="text-on-surface-variant font-label-sm text-label-sm">•</span>
                  <span class="font-label-sm text-label-sm text-on-surface-variant">Q3 FY25 Active Cascade</span> -->
                </div>
                <h1 class="font-headline-lg text-headline-lg text-on-surface">Objective Hierarchy &amp; Alignment Tree
                </h1>
                <p class="font-body-md text-body-md text-on-surface-variant">Break each objective into milestones, then into
                  checklists and sub-steps small enough to finish.</p>
              </div>
              <div class="flex flex-wrap items-center gap-space-sm">
                <div class="inline-flex p-1 bg-surface-container rounded-xl shadow-sm">
                  <button type="button" aria-pressed="true"
                    class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-surface-container-lowest text-primary shadow-sm font-title-sm text-title-sm transition-all"
                    id="view-tree-btn">
                    <span class="material-symbols-outlined text-lg">account_tree</span>
                    <span>Tree Diagram</span>
                  </button>
                  <button type="button" disabled title="Coming soon"
                    class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-on-surface-variant opacity-50 cursor-not-allowed font-title-sm text-title-sm"
                    id="view-list-btn">
                    <span class="material-symbols-outlined text-lg">format_list_bulleted</span>
                    <span>Indented List</span>
                  </button>
                  <button type="button" disabled title="Coming soon"
                    class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-on-surface-variant opacity-50 cursor-not-allowed font-title-sm text-title-sm"
                    id="view-matrix-btn">
                    <span class="material-symbols-outlined text-lg">grid_view</span>
                    <span>Matrix View</span>
                  </button>
                </div>
                <button
                  class="flex items-center gap-1.5 px-3 py-2 bg-surface-container-lowest hover:bg-surface-container text-on-surface font-title-sm text-title-sm rounded-lg shadow-sm transition-colors">
                  <span class="material-symbols-outlined text-lg text-primary">file_download</span>
                  <span>Export SVG</span>
                </button>
              </div>
            </div>
            <div
              class="p-space-sm bg-surface-container-low rounded-xl flex flex-wrap items-center justify-between gap-space-sm">
              <div class="flex flex-wrap items-center gap-space-sm flex-1 min-w-[280px]">
                <div class="relative w-64">
                  <span
                    class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-base">filter_alt</span>
                  <input
                    class="w-full h-9 pl-9 pr-3 bg-surface-container-lowest rounded-lg font-body-sm text-body-sm text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary-container/20"
                    id="node-search-input" placeholder="Filter objectives, milestones, steps..." type="text" />
                </div>
                <div class="h-6 w-px bg-surface-container-highest hidden sm:block"></div>
                <div class="flex items-center gap-1.5">
                  <span class="font-label-sm text-label-sm text-on-surface-variant">Team:</span>
                  <button
                    class="h-9 px-2.5 bg-surface-container-lowest hover:bg-surface-container text-on-surface rounded-lg font-label-md text-label-md flex items-center gap-1 shadow-sm">
                    <span>All Entities</span>
                    <span class="material-symbols-outlined text-base">keyboard_arrow_down</span>
                  </button>
                </div>
                <div class="flex items-center gap-1.5">
                  <span class="font-label-sm text-label-sm text-on-surface-variant">Status:</span>
                  <button
                    class="h-9 px-2.5 bg-surface-container-lowest hover:bg-surface-container text-on-surface rounded-lg font-label-md text-label-md flex items-center gap-1 shadow-sm">
                    <span>Any Status</span>
                    <span class="material-symbols-outlined text-base">keyboard_arrow_down</span>
                  </button>
                </div>
              </div>
              <div class="flex flex-wrap items-center gap-space-xs">
                <button
                  class="p-2 bg-surface-container-lowest hover:bg-surface-container text-on-surface-variant hover:text-on-surface rounded-lg shadow-sm transition-colors" type="button"
                  id="zoom-out-btn" title="Zoom Out">
                  <span class="material-symbols-outlined text-lg">zoom_out</span>
                </button>
                <span class="font-label-md text-label-md text-on-surface px-2 min-w-[50px] text-center"
                  id="zoom-indicator">100%</span>
                <button
                  class="p-2 bg-surface-container-lowest hover:bg-surface-container text-on-surface-variant hover:text-on-surface rounded-lg shadow-sm transition-colors" type="button"
                  id="zoom-in-btn" title="Zoom In">
                  <span class="material-symbols-outlined text-lg">zoom_in</span>
                </button>
                <button
                  class="px-2.5 py-1.5 bg-surface-container-lowest hover:bg-surface-container text-on-surface rounded-lg font-label-md text-label-md shadow-sm transition-colors" type="button"
                  id="zoom-reset-btn">
                  Reset
                </button>
                <div class="h-6 w-px bg-surface-container-highest mx-1"></div>
                <button type="button" title="Show only the objectives"
                  class="flex items-center gap-1 px-3 py-1.5 bg-surface-container-lowest hover:bg-surface-container text-on-surface rounded-lg font-title-sm text-title-sm shadow-sm transition-colors"
                  id="toggle-collapse-all">
                  <span class="material-symbols-outlined text-base">unfold_less</span>
                  <span id="collapse-all-text">Collapse All</span>
                </button>
                <button type="button" title="Discard your edits and restore the original data"
                  class="flex items-center gap-1 px-3 py-1.5 bg-surface-container-lowest hover:bg-surface-container text-on-surface rounded-lg font-title-sm text-title-sm shadow-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                  data-reset-data>
                  <span class="material-symbols-outlined text-base">restart_alt</span>
                  <span data-reset-label>Reset data</span>
                </button>
              </div>
            </div>
          </div>
          <!-- Work area: fixed to the viewport height; tree and inspector scroll independently. -->
          <div class="relative w-full flex h-[calc(100vh-4rem)] min-h-[560px]">
            <div class="flex-1 min-w-0 overflow-auto p-space-lg relative bg-surface-bright"
              id="canvas-container">
              <!-- Rendered from data/hierarchy.json by assets/js/pages/objectives.js -->
              <div class="relative mx-auto w-max min-w-full pb-24 transition-transform duration-200 origin-top"
                id="tree-root-canvas">
                <p class="pt-space-xl text-center font-body-md text-body-md text-on-surface-variant">Loading hierarchy…</p>
              </div>
            </div>
            <div class="hierarchy-backdrop" data-inspector-close></div>
            <aside class="hierarchy-inspector bg-surface-container-lowest shadow-xl flex flex-col" id="inspector-panel"
              aria-label="Node inspector"></aside>
          </div>
        </div>
      </main>
      <div data-include="footer"></div>
    </div>

    <script src="assets/js/layout.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/okrs.js"></script>
    <script src="assets/js/drawer.js"></script>
    <script src="assets/js/objective-form.js"></script>
    <script src="assets/js/router.js"></script>
    <script src="assets/js/pages/objectives.js"></script>
  </body>
</html>
